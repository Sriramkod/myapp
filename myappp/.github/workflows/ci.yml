name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 between runs

      # 3. Build & run tests
      - name: Build with Maven
        run: ./mvnw verify -B

      # 4. Upload test reports (visible in GitHub Actions UI)
      - name: Upload test report
        if: always()            # run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test       # only runs if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided by GitHub, no setup needed

      # 3. Extract metadata for tagging
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-          # e.g. sha-a1b2c3d
            type=ref,event=branch         # e.g. main, develop
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 4. Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}